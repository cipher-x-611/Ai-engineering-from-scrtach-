<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
  </head>
  <body>
    <table border="3">
      <tr>
        <strong><center>STUDENT REGISTRATION FORM</center></strong>
      </tr>

      <tr>
        <th>FULL NAME</th>
        <td>
          <input
            type="text"
            name="FULL NAME"
            id="FULL NAME"
            placeholder="Enter your Name"
            required
          />
        </td>
      </tr>
      <tr>
        <th>Email</th>
        <td>
          <input
            type="email"
            name="Email"
            id="Email"
            placeholder="Enter your email"
            required
          />
        </td>
      </tr>
      <tr>
        <th>PassWord</th>
        <td>
          <input
            type="password"
            name="PassWord"
            id="PassWord"
            placeholder="Enter your PassWord"
            required
          />
        </td>
      </tr>
      <tr>
        <th>Phone</th>
        <td>
          <input
            type="tel"
            name="phone"
            id="phone"
            placeholder="Enter your phone number "
            required
          />
        </td>
      </tr>
      <tr>
        <th>CNIC</th>
        <td>
          <input
            type="number"
            name="CNIC"
            id="CNIC"
            placeholder="Enter your CNIC"
            pattern="[0-9]{5}-[0-9]{7}-[0-9]{1}"
            required
          />
        </td>
      </tr>
      <tr>
        <th>DATE OF BIRTH</th>
        <td>
          <input
            type="date"
            name="DATE OF BIRTH"
            id="DATE OF BIRTH"
            placeholder="Enter your DOB "
            required
          />
        </td>
      </tr>
      <tr>
        <th>GENDER</th>
        <td>
          <input type="radio" name="GENDER" id="MALE" value="MALE" required />
          <label for="MALE">MALE</label>
          <input
            type="radio"
            name="GENDER"
            id="FEMALE"
            value="FEMALE"
            required
          />
          <label for="FEMALE">FEMALE </label>
        </td>
      </tr>
      <tr>
        <th>Skills</th>
        <td>
          <input type="checkbox" name="Skills" id="html" value="html" />
          <label for="html">HTML</label>

          <input type="checkbox" name="Skills" id="CSS" value="CSS" />
          <label for="CSS">CSS</label> <br />
          <input
            type="checkbox"
            name="Skills"
            id="JavaScript"
            value="JavaScript"
          />
          <label for="JavaScript">JavaScript</label> <br />
          <input type="checkbox" name="Skills" id="C#" value="C#" />
          <label for="C#">C#</label>
        </td>
      </tr>
      <tr>
        <th>Department</th>
        <td>
          <label for="Department">SELECT Department</label>
          <select name="Department" id="Department">
            <option value="">Select a Department</option>
            <option value="Software Engineering ">Software Engineering</option>
            <option value="IT">IT</option>
            <option value="AI">AI</option>
            <option value="URDU">URDU</option>
            <option value="PUNJABI">PUNJABI</option>
            <option value="BIOCHEMISTRY">BIOCHEMISTRY</option>
          </select>
        </td>
      </tr>
      <tr>
        <th>Adress</th>
        <td>
          <textarea name="Adress" id="Adress" rows="5" cols="15"></textarea>
        </td>
      </tr>
      <tr>
        <td>Upload image</td>
        <td>
          <label for="image">Upload Image</label>
          <input type="file" name="image" id="image" required width="100" />
        </td>
      </tr>
      <tr>
        <td>
          <button><a href="Login.html">Submit</a></button>
        </td>
        <td>
          <button><a href="studentfile.html">Reset</a></button>
        </td>
      </tr>
    </table>
    <hr />

    <p>If you have any query <a href="contact.html">Contact </a> us at</p>
    <hr />
  </body>
