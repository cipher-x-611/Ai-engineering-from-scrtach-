<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration form</title>
  </head>
  <body>
    <h1>Student Registration Form</h1>
    <h3>Univresity of Gujrat</h3>
    <hr />
    <label for="Name ">Name:</label>
    <input type="text" placeholder="Enter Your Name" required /> <br />
    <label for="Email: ">Email</label>
    <input type="email" placeholder="Enter Your Email" required /> <br />
    <label for="PassWord">Password </label>
    <input type="password" placeholder="PassWord" required /> <br />
    <hr />

    <table border="2">
      <tr>
        <th>Name</th>
        <td><input type="text" placeholder="Enter Your Name " required /></td>
      </tr>
      <tr>
        <th>EMAIL</th>
        <td><input type="email" placeholder="Enter Your Email " required /></td>
      </tr>
      <tr>
        <th>PassWord</th>
        <td>
          <input type="password" placeholder="Enter PassWord " required />
        </td>
      </tr>
      <tr>
        <th>Mobile NO</th>
        <td>
          <input
            type="tel"
            pattern="\+[0-9]{3}-[0-9]{3}-[0-9]{7}"
            placeholder="+92-xxx-xxxxxxx" required
          />
        </td>
      </tr>
      <tr>
        <th>CNIC</th>
        <td>
          <input
            type="text"
            pattern="[0-9]{5}-[0-9]{7}-[0-9]{1}"
            placeholder="ENTER CNIC "
            required aria-errormessage="please use proper format "
          />
        </td>
      </tr>
    </table>
    <input type="button" value="Submit ">
  </body>
</html>
