<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Section</title>
    <link rel="stylesheet" href="aicode.css">
</head>
<body>

<section class="contact-section">

    <div class="heading">
        <h2>Do you like our works? Do you like our philosophy? Contact us!</h2>
    </div>

    <div class="container">

        <!-- Left Side -->
        <div class="left">

            <h2>Contact Us</h2>

            <table>

                <tr>
                    <td>Name</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>Email</td>
                    <td><input type="email"></td>
                </tr>

                <tr>
                    <td>Subject</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>Message</td>
                    <td><textarea></textarea></td>
                </tr>

            </table>

            <button>Submit</button>

        </div>


        <!-- Right Side -->

        <div class="right">

            <h2>From our Blog</h2>

            <div class="blog">

                <img src="https://picsum.photos/80?1">

                <p>FIFA World Cup 2010 Wallpapers by WeGraphics</p>

            </div>

            <div class="blog">

                <img src="https://picsum.photos/80?2">

                <p>Create a Cosmic Sci-Fi Photo Manipulation</p>

            </div>

            <div class="blog">

                <img src="https://picsum.photos/80?3">

                <p>How to enhance your subject using lighting</p>

            </div>

        </div>

    </div>

</section>

</body>
</html>
